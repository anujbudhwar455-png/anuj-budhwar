name: Build and publish portfolio

on:
  push:
    branches: [main]
    paths:
      - 'v2/src/**'
      - 'v2/public/**'
      - 'v2/package.json'
      - 'v2/package-lock.json'
      - 'v2/next.config.mjs'
      - 'v2/tailwind.config.ts'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-portfolio
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install & build
        working-directory: v2
        run: |
          npm ci
          npm run build
      - name: Sync static export to repo root
        run: |
          rm -rf _next books music projects images icons 404
          rm -f index.html index.txt 404.html favicon.ico robots.txt sitemap.xml
          cp -a v2/out/. .
          touch .nojekyll
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "chore: publish Next.js static export to Pages root"
          git push
